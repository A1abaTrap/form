<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu xác nhận quên chấm công</title>

    <style>
        * {
            box-sizing: border-box;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            font-family: "Times New Roman", serif;
        }

        /* =========================
           KHỔ A4 - CHIA 3 x 3
           ========================= */
        .page {
            width: 210mm;
            height: 297mm;

            display: grid;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            /* Tận dụng gần hết khổ A4 */
            padding: 3mm;
        }

        /* =========================
           MỖI PHIẾU
           ========================= */
        .form {
            border: 1px dashed #000;

            /* Tăng khoảng cách bên trong */
            padding: 5mm 5mm;

            font-size: 15px;

            overflow: hidden;
        }

        /* =========================
           TIÊU ĐỀ
           ========================= */
        .title {
            text-align: center;
            font-weight: bold;

            font-size: 15px;

            line-height: 1.25;

            margin-bottom: 7px;
        }

        .title.company {
            font-size: 18px;
            margin-bottom: 5px;
        }

        /* =========================
           THÔNG TIN
           ========================= */
        .info {
            line-height: 1.8;
        }

        .info p {
            margin: 2px 0;
            white-space: nowrap;
        }

        .input-line {
            display: inline-block;

            border-bottom: 1px dotted #000;

            width: 70%;

            height: 17px;

            vertical-align: bottom;
        }

        .date-line {
            display: inline-block;

            border-bottom: 1px dotted #000;

            width: 80%;

            height: 17px;

            vertical-align: bottom;
        }

        /* =========================
           BẢNG GIỜ
           ========================= */
        table {
            width: 100%;

            border-collapse: collapse;

            margin-top: 9px;

            font-size: 15px;
        }

        td {
            border: 1px solid #000;

            padding: 7px 5px;

            height: 34px;
        }

        td:first-child {
            width: 60%;
        }

        .time {
            text-align: center;

            font-weight: bold;

            white-space: nowrap;
        }

        /* =========================
           CHỮ KÝ
           ========================= */
        .signatures {
            display: grid;

            grid-template-columns: 1fr 1fr;

            margin-top: 10px;

            text-align: center;

            font-size: 15px;
        }

        .signature-space {
            height: 35px;
        }

        /* =========================
           IN
           ========================= */
        @media print {

            html,
            body {
                width: 210mm;
                height: 297mm;
            }

            .page {
                width: 210mm;
                height: 297mm;

                padding: 3mm;
            }

            .form {
                break-inside: avoid;
            }
        }

        /* =========================
           XEM TRÊN MÀN HÌNH
           ========================= */
        @media screen {

            body {
                background: #ddd;
            }

            .page {
                margin: 10px auto;

                background: #fff;

                box-shadow:
                    0 0 8px rgba(0, 0, 0, 0.25);
            }
        }
    </style>
</head>

<body>

<div class="page" id="page"></div>

<script>

    const page = document.getElementById("page");

    const formHTML = `

        <div class="form">

            <!-- TÊN CÔNG TY -->
            <div class="title company">
                CÔNG TY CỔ PHẦN BMFOOD
            </div>

            <!-- TIÊU ĐỀ -->
            <div class="title">
                PHIẾU XÁC NHẬN<br>
                QUÊN CHẤM CÔNG
            </div>

            <!-- THÔNG TIN -->
            <div class="info">

                <p>
                    <strong>Họ và tên:</strong>
                    <span class="input-line"></span>
                </p>

                <p>
                    <strong>Bộ phận:</strong>
                    <span class="input-line"></span>
                </p>

                <p>
                    <strong>Ngày:</strong>
                    <span class="date-line"></span>
                </p>

            </div>

            <!-- THỜI GIAN -->
            <table>

                <tr>
                    <td>
                        <strong>Giờ vào thực tế</strong>
                    </td>

                    <td class="time">
                        ____ : ____
                    </td>
                </tr>

                <tr>
                    <td>
                        <strong>Giờ ra thực tế</strong>
                    </td>

                    <td class="time">
                        ____ : ____
                    </td>
                </tr>

            </table>

            <!-- CHỮ KÝ -->
            <div class="signatures">

                <div>
                    <strong>Nhân viên</strong>

                    <div class="signature-space"></div>
                </div>

                <div>
                    <strong>Quản lý</strong>

                    <div class="signature-space"></div>
                </div>

            </div>

        </div>

    `;

    /* Tạo đúng 9 phiếu = 3 x 3 */
    for (let i = 0; i < 9; i++) {
        page.insertAdjacentHTML("beforeend", formHTML);
    }

</script>

</body>
</html>
